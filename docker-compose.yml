services:
  database:
    image: postgres:16-alpine
    container_name: cinema_crud_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema_crud
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "5432:5432"
    volumes:
      - cinema_crud_db_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: cinema_crud_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - database

volumes:
  cinema_crud_db_data:
